<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dungeon Crawler - Movement Demo</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #1a1a1a;
    font-family: sans-serif;
  }
  canvas {
    display: block;
  }
  #hint {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #ccc;
    font-size: 14px;
    background: rgba(0,0,0,0.5);
    padding: 8px 12px;
    border-radius: 6px;
  }
</style>
</head>
<body>
<div id="hint">Move with W A S D or Arrow Keys</div>
<canvas id="game"></canvas>

<script>
// ----- Setup -----
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ----- Sprites -----
// To change how something looks, just replace the file in the /images
// folder with a new image using the SAME filename. Nothing here needs
// to change. Keep player.png roughly square (any size works, it gets
// scaled), and keep the tiles square too since they repeat.
const sprites = {
  player: new Image(),
  wallTile: new Image(),
  floorTile: new Image(),
};
sprites.player.src = 'images/player.png';
sprites.wallTile.src = 'images/wall_tile.png';
sprites.floorTile.src = 'images/floor_tile.png';

// ----- The Map -----
const MAP_WIDTH = 3000;
const MAP_HEIGHT = 3000;

const walls = [
  { x: 400, y: 300, w: 200, h: 40 },
  { x: 900, y: 700, w: 40, h: 300 },
  { x: 1500, y: 1200, w: 300, h: 40 },
  { x: 2000, y: 500, w: 40, h: 400 },
  { x: 700, y: 1800, w: 250, h: 250 },
  { x: 2300, y: 2000, w: 200, h: 40 },
  { x: 1200, y: 2400, w: 400, h: 40 },
];

// ----- The Player -----
const player = {
  x: MAP_WIDTH / 2,
  y: MAP_HEIGHT / 2,
  size: 32,
  speed: 4,
};

// ----- Input -----
const keys = {};
window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function tryMove(dx, dy) {
  const half = player.size / 2;

  let newX = player.x + dx;
  let blockedX = walls.some(w =>
    rectsOverlap(newX - half, player.y - half, player.size, player.size, w.x, w.y, w.w, w.h)
  );
  if (!blockedX) {
    newX = Math.max(half, Math.min(MAP_WIDTH - half, newX));
    player.x = newX;
  }

  let newY = player.y + dy;
  let blockedY = walls.some(w =>
    rectsOverlap(player.x - half, newY - half, player.size, player.size, w.x, w.y, w.w, w.h)
  );
  if (!blockedY) {
    newY = Math.max(half, Math.min(MAP_HEIGHT - half, newY));
    player.y = newY;
  }
}

function update() {
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= player.speed;
  if (keys['s'] || keys['arrowdown']) dy += player.speed;
  if (keys['a'] || keys['arrowleft']) dx -= player.speed;
  if (keys['d'] || keys['arrowright']) dx += player.speed;

  if (dx !== 0 && dy !== 0) {
    dx *= 0.7071;
    dy *= 0.7071;
  }

  tryMove(dx, dy);
}

// ----- Drawing -----
function draw() {
  const camX = player.x - canvas.width / 2;
  const camY = player.y - canvas.height / 2;

  // Floor: tile the floor sprite across the visible screen
  const floorSize = 100;
  if (sprites.floorTile.complete) {
    const startX = -((camX) % floorSize) - floorSize;
    const startY = -((camY) % floorSize) - floorSize;
    for (let x = startX; x < canvas.width + floorSize; x += floorSize) {
      for (let y = startY; y < canvas.height + floorSize; y += floorSize) {
        ctx.drawImage(sprites.floorTile, x, y, floorSize, floorSize);
      }
    }
  } else {
    ctx.fillStyle = '#2b2b2b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Map border
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 4;
  ctx.strokeRect(-camX, -camY, MAP_WIDTH, MAP_HEIGHT);

  // Walls: tile the wall sprite across each wall's rectangle
  const wallTileSize = 40;
  walls.forEach(w => {
    if (sprites.wallTile.complete) {
      for (let x = 0; x < w.w; x += wallTileSize) {
        for (let y = 0; y < w.h; y += wallTileSize) {
          const tw = Math.min(wallTileSize, w.w - x);
          const th = Math.min(wallTileSize, w.h - y);
          ctx.drawImage(
            sprites.wallTile,
            0, 0, wallTileSize * (tw / wallTileSize), wallTileSize * (th / wallTileSize),
            w.x - camX + x, w.y - camY + y, tw, th
          );
        }
      }
    } else {
      ctx.fillStyle = '#8a5a3b';
      ctx.fillRect(w.x - camX, w.y - camY, w.w, w.h);
    }
  });

  // Player
  if (sprites.player.complete) {
    ctx.drawImage(
      sprites.player,
      canvas.width / 2 - player.size / 2,
      canvas.height / 2 - player.size / 2,
      player.size, player.size
    );
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
